<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI/ML based text-to-text machine translation from Nepalese and Sinhalese to English</title>

<style>
body{
    font-family: system-ui, sans-serif;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:820px;
    background:#020617;
    padding:20px 22px 22px;
    border-radius:16px;
    box-shadow:0 0 50px rgba(0,0,0,0.6);
}

textarea{
    width:100%;
    height:140px;
    background:#020617;
    color:white;
    border:1px solid #1e293b;
    border-radius:10px;
    padding:12px;
    resize:none;
    font-size:15px;
}

select,button{
    padding:8px 12px;
    background:#020617;
    color:white;
    border:1px solid #1e293b;
    border-radius:10px;
}

.row{
    display:flex;
    gap:10px;
    margin:10px 0;
    align-items:center;
}

button{
    cursor:pointer;
}

button:hover{
    background:#020617;
    border-color:#38bdf8;
}

.progress-wrap{
    height:4px;
    width:100%;
    background:#020617;
    border-radius:10px;
    overflow:hidden;
    margin:6px 0 8px;
    border:1px solid #1e293b;
}

.progress{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22d3ee,#38bdf8,#818cf8);
    transition:width 0.2s;
}

.status{
    font-size:12px;
    color:#94a3b8;
    min-height:16px;
}

.meta{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#64748b;
    margin-top:4px;
}

.swap{
    font-size:18px;
    padding:4px 10px;
}

</style>
</head>

<body>
<div class="card">

<h2>⚡ Offline NLLB Translator</h2>

<div class="row">
<select id="src">
    <option value="si">Sinhala</option>
    <option value="ne">Nepali</option>
    <option value="te">Telugu</option>
    <option value="kn">Kannada</option>
    <option value="ta">Tamil</option>
    <option value="ml">Malayalam</option>
    <option value="hi">Hindi</option>
    <option value="en">English</option>
</select>

<button class="swap" onclick="swapLang()">⇄</button>

<select id="tgt">
    <option value="en">English</option>
    <option value="si">Sinhala</option>
    <option value="ne">Nepali</option>
    <option value="te">Telugu</option>
    <option value="kn">Kannada</option>
    <option value="ta">Tamil</option>
    <option value="ml">Malayalam</option>
    <option value="hi">Hindi</option>
</select>
</div>

<textarea id="input" placeholder="Type here..."></textarea>

<div class="meta">
    <div id="charCount">0 chars</div>
    <div id="latency"></div>
</div>

<div class="status" id="status"></div>

<div class="progress-wrap">
    <div class="progress" id="bar"></div>
</div>

<textarea id="output" placeholder="Live translation will appear here..."></textarea>

<div class="row">
    <button onclick="manualTranslate()">Translate now</button>
</div>

</div>

<script>
let timer = null;
let currentJob = 0;

const MAX_CHARS = 400;

const input = document.getElementById("input");
const charCount = document.getElementById("charCount");
const status = document.getElementById("status");

input.addEventListener("input", () => {

    // hard cap
    if(input.value.length > MAX_CHARS){
        input.value = input.value.slice(0, MAX_CHARS);
        status.innerText = "⚠ Max 400 characters allowed";
    }else{
        status.innerText = "";
    }

    charCount.innerText =
        input.value.length + " / " + MAX_CHARS + " chars";

    realtimeTranslate();
});

function swapLang(){
    const s = src.value;
    src.value = tgt.value;
    tgt.value = s;

    const out = output.value;
    output.value = input.value;
    input.value = out;

    // also enforce cap after swap
    if(input.value.length > MAX_CHARS){
        input.value = input.value.slice(0, MAX_CHARS);
    }

    charCount.innerText =
        input.value.length + " / " + MAX_CHARS + " chars";

    realtimeTranslate();
}

function manualTranslate(){
    triggerTranslate();
}

function realtimeTranslate(){
    clearTimeout(timer);
    timer = setTimeout(triggerTranslate, 400);
}

function startBar(){
    const bar = document.getElementById("bar");
    bar.style.width = "10%";
    let p = 10;

    const id = setInterval(()=>{
        if(p < 90){
            p += Math.random()*6;
            bar.style.width = p + "%";
        }
    },200);

    return id;
}

async function triggerTranslate(){

    const text = input.value.trim();

    if(!text){
        output.value = "";
        return;
    }

    const srcLang = src.value;
    const tgtLang = tgt.value;

    const myJob = ++currentJob;

    const latency = document.getElementById("latency");
    const bar = document.getElementById("bar");

    status.innerText = "Model is thinking locally…";
    latency.innerText = "";

    const barTimer = startBar();
    const start = performance.now();

    const res = await fetch("/translate",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({
            text:text,
            src:srcLang,
            tgt:tgtLang
        })
    });

    const data = await res.json();

    if(myJob !== currentJob) return;

    clearInterval(barTimer);
    bar.style.width = "100%";

    output.value = data.translation;

    const end = performance.now();
    latency.innerText = Math.round(end-start) + " ms";

    status.innerText = "Done (offline inference)";

    setTimeout(()=>{
        bar.style.width = "0%";
    },400);
}
</script>
</body>
</html>
